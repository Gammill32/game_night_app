services:

  postgres:
    image: postgres:16
    container_name: game_night_postgres
    # No host port, and only on the private game_night_internal network: the
    # app reaches it there as game_night_postgres:5432. (It used to sit on
    # web_network, where anything behind Traefik could reach it.)
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    volumes:
      - /vault/game_night_db/postgres_data:/var/lib/postgresql/data
      - /vault/game_night_db/init_db:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - game_night_internal

  game_night_app:
    build: .
    container_name: game_night_app
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - FLASK_DEBUG
      - SECRET_KEY
      - DATABASE_URL
      - PGHOST
      - PGPORT
      - MAIL_SERVER
      - MAIL_PORT
      - MAIL_USE_TLS
      - MAIL_USE_SSL
      - MAIL_USERNAME
      - MAIL_PASSWORD
      - MAIL_DEFAULT_SENDER
      - FLASK_APP
      - BGG_API_TOKEN
      - SESSION_TYPE
      - MAX_UPLOAD_MB
      - APP_BASE_URL
      - MEDIA_DIR=/app/media
    volumes:
      # Night photos and food receipts. Create the dataset before the first
      # deploy, or Docker makes a root-owned plain directory here instead:
      #   zfs create -o mountpoint=/vault/game_night_media vault/game_night_media
      #   chown 1000:1000 /vault/game_night_media
      - /vault/game_night_media:/app/media
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - web_network
      - game_night_internal
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "traefik.enable=true"
      # Two networks: tell Traefik which one to reach the app on.
      - "traefik.docker.network=web_network"

      # Router for game night app
      - "traefik.http.routers.game_night.rule=Host(`gamenight.sgammill.com`)"
      - "traefik.http.routers.game_night.entrypoints=websecure"
      - "traefik.http.routers.game_night.tls.certresolver=cloudflare"

      # Service config
      - "traefik.http.services.game_night.loadbalancer.server.port=8000"

networks:
  web_network:
    external: true
  # Create once: docker network create --internal --subnet 10.34.0.0/16 game_night_internal
  # (always a 10.x --subnet: Docker's fallback 192.168.x/20 pools cover the VLANs)
  game_night_internal:
    external: true
