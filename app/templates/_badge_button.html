{# A badge tile that opens the badge dialog. Expects: pb (PersonBadge), earned_on, mine (bool). #}
{% set when = earned_on(pb) %}
<button type="button"
        data-badge-icon="{{ pb.badge.icon }}" data-badge-name="{{ pb.badge.name }}" data-badge-rule="{{ pb.badge.description }}"
        data-badge-when="{{ ('You earned it' if mine else pb.person.first_name ~ ' earned it') ~ ' on ' ~ when.strftime('%B %-d, %Y') ~ '.' }}"
        {% if pb.game_night and (mine or current_user.admin or current_user.owner) %}
        data-badge-night-url="{{ url_for('game_night.view_game_night', game_night_id=pb.game_night_id) }}#badges"
        data-badge-night-label="See the {{ pb.game_night.date.strftime('%B %-d') }} game night →"
        {% endif %}
        class="group flex w-full flex-col items-center rounded-xl border border-stone-200 bg-white p-4 text-center shadow-sm transition hover:border-red-300 hover:shadow focus:outline-none focus-visible:ring-2 focus-visible:ring-red-400">
  <span class="text-3xl transition-transform group-hover:scale-110" aria-hidden="true">{{ pb.badge.icon }}</span>
  <span class="mt-2 text-sm font-semibold text-stone-800">{{ pb.badge.name }}</span>
  <span class="mt-0.5 text-xs text-stone-500">{{ when.strftime('%b %-d, %Y') }}</span>
</button>
