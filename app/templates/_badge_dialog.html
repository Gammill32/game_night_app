{# One dialog for badge details. Buttons with data-badge-* attributes open it:
   data-badge-icon, -name, -rule, -when (text), -night-url (optional), -night-label. #}
<dialog id="badgeDialog" class="w-[min(92vw,26rem)] rounded-2xl p-0 shadow-xl backdrop:bg-black/50">
  <div class="p-6 text-center">
    <div class="text-5xl" data-f="icon" aria-hidden="true"></div>
    <h2 class="mt-2 text-lg font-bold text-stone-800" data-f="name"></h2>
    <p class="mt-2 text-sm text-stone-600" data-f="rule"></p>
    <p class="mt-4 text-sm text-stone-800" data-f="when"></p>
    <a class="mt-1 inline-block text-sm font-medium text-red-600 underline hover:text-red-700" data-f="night"></a>
    <div class="mt-5 flex justify-center gap-3">
      <a href="{{ url_for('games.badges') }}" class="rounded-lg border border-stone-300 px-4 py-2 text-sm font-medium text-stone-700 hover:bg-stone-50">All badges</a>
      <button type="button" data-close class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700">Close</button>
    </div>
  </div>
</dialog>
<script>
  (function () {
    const dlg = document.getElementById('badgeDialog');
    const f = name => dlg.querySelector(`[data-f="${name}"]`);
    document.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-badge-name]');
      if (!btn) return;
      const d = btn.dataset;
      f('icon').textContent = d.badgeIcon;
      f('name').textContent = d.badgeName;
      f('rule').textContent = d.badgeRule;
      f('when').textContent = d.badgeWhen || '';
      const night = f('night');
      night.hidden = !d.badgeNightUrl;
      if (d.badgeNightUrl) { night.href = d.badgeNightUrl; night.textContent = d.badgeNightLabel; }
      dlg.showModal();
    });
    dlg.querySelector('[data-close]').addEventListener('click', () => dlg.close());
    dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  })();
</script>
