{# Find-a-game widget: search the group's library and BoardGameGeek, pick one.
   mode: "own" (adding a game you own) or "wish" (adding to your wishlist). #}
<div id="bgg-search-widget" class="space-y-2">
  <label for="bgg-query" class="block text-sm font-medium text-stone-700">Search for the game</label>
  <input type="search" id="bgg-query" name="q" placeholder="Type a name, e.g. Cascadia" autocomplete="off"
         class="w-full rounded-lg border border-stone-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent"
         hx-get="{{ url_for('games.bgg_search') }}"
         hx-trigger="input changed delay:350ms, search"
         hx-target="#bgg-results"
         hx-vals='{"mode": "{{ mode }}"}'
         hx-indicator="#bgg-searching">
  <p id="bgg-searching" class="htmx-indicator text-xs text-stone-500">Searching…</p>
  <div id="bgg-results"></div>
  <details class="pt-1">
    <summary class="cursor-pointer text-xs text-stone-600 underline">Not on BoardGameGeek? Add it by name</summary>
    <label class="mt-2 block text-sm font-medium text-stone-700">Game name
      <input name="name" maxlength="120" placeholder="e.g. Grandma's card game"
             class="mt-1 block w-full rounded-lg border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
    </label>
    <p class="mt-1 text-xs text-stone-500">It's added without a picture or details; an admin can fill those in later.</p>
  </details>
</div>
