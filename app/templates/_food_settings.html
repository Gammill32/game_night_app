{# Food fields for the start / edit game night forms.
   Expects: people, food_mode, food_provider_id, food_note, food_mode_labels. #}
<div class="bg-white rounded-xl border border-stone-200 shadow-sm p-5 mb-5 space-y-4">
  <h2 class="text-lg font-semibold text-stone-800">Food</h2>
  <div class="grid sm:grid-cols-2 gap-4">
    <div>
      <label for="foodMode" class="block text-sm font-medium text-stone-700 mb-1">Food plan</label>
      <select name="food_mode" id="foodMode"
              class="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent">
        {% for mode, label in food_mode_labels.items() %}
        <option value="{{ mode }}" {% if mode == food_mode %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div id="foodProviderField" class="{% if food_mode != 'provided' %}hidden{% endif %}">
      <label for="foodProvider" class="block text-sm font-medium text-stone-700 mb-1">Provided by</label>
      <select name="food_provider_id" id="foodProvider"
              class="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent">
        {% for person in people %}
        <option value="{{ person.id }}" {% if person.id == (food_provider_id or current_user.id) %}selected{% endif %}>{{ person.first_name }} {{ person.last_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div id="foodNoteField" class="sm:col-span-2 {% if food_mode == 'none' %}hidden{% endif %}">
      <label for="foodNote" class="block text-sm font-medium text-stone-700 mb-1">Food note <span class="font-normal text-stone-500">(optional)</span></label>
      <input name="food_note" id="foodNote" maxlength="120" value="{{ food_note or '' }}" placeholder="e.g. Tacos, or: ordering pizza around 7"
             class="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent">
    </div>
  </div>
  <p id="foodHelp" class="text-xs text-stone-500"></p>
</div>
<script>
  (function () {
    const mode = document.getElementById('foodMode');
    const help = {
      none: 'Nothing about food shows on the night.',
      provided: 'The night page shows who is providing food and your note.',
      signup: 'Players see a list of who is bringing what. Add items on the night page for people to claim, or let them add their own.',
      split: "Whoever buys food logs the cost on the night page. It's split evenly among the players who can make it, and each person gets a pay link to the buyer's Venmo, Cash App or PayPal.",
      both: 'A sign-up list for what people bring, plus split costs for anything someone buys.',
    };
    function sync() {
      document.getElementById('foodHelp').textContent = help[mode.value] || '';
      document.getElementById('foodProviderField').classList.toggle('hidden', mode.value !== 'provided');
      document.getElementById('foodNoteField').classList.toggle('hidden', mode.value === 'none');
    }
    mode.addEventListener('change', sync);
    sync();
  })();
</script>
