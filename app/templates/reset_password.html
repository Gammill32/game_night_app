{% extends "auth_base.html" %}
{% block title %}Choose a New Password — Game Night{% endblock %}
{% block content %}
<h2 class="text-xl font-bold text-stone-800 mb-2">Choose a new password</h2>
<p class="text-sm text-stone-600 mb-6">For {{ person.first_name }} {{ person.last_name }} ({{ person.email }}).</p>
<form method="POST" class="space-y-4">
  <div>
    <label for="new_password" class="block text-sm font-medium text-stone-700 mb-1">New password</label>
    <input type="password" id="new_password" name="new_password" required minlength="8" autocomplete="new-password"
           class="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent" />
    <p class="mt-1 text-xs text-stone-500">At least 8 characters.</p>
  </div>
  <div>
    <label for="confirm_password" class="block text-sm font-medium text-stone-700 mb-1">Type it again</label>
    <input type="password" id="confirm_password" name="confirm_password" required minlength="8" autocomplete="new-password"
           class="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent" />
  </div>
  <button type="submit" class="w-full rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700">Save new password</button>
</form>
{% endblock %}
